<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>风格美发</title>

<style>

body{
    margin:0;
    font-family:"Microsoft YaHei";
    background:#faf7f2;
    color:#333;
}

header{
    padding:30px;
    text-align:center;
    background:white;
}

.logo{
    font-size:38px;
    font-weight:bold;
    letter-spacing:8px;
}

.nav{
    margin-top:20px;
}

.nav span{
    margin:0 15px;
}


.banner{
    padding:70px 20px;
    text-align:center;
}


.banner h1{
    font-size:45px;
}

.banner h1 span{
    color:#b88652;
}


.banner p{
    font-size:20px;
}


button{
    background:#333;
    color:white;
    border:0;
    padding:15px 35px;
    border-radius:30px;
    font-size:18px;
}


.photo{
    text-align:center;
}


.photo img{
    width:80%;
    max-width:700px;
    border-radius:15px;
}


.box{
    background:white;
    margin:40px;
    padding:30px;
    border-radius:20px;
}


</style>

</head>


<body>


<header>

风格美发
</div>

首页　服务项目　价格　联系我们
</div>

</header>



<section class="banner">

<h1>
让每一次造型<br>
<span>成为你的风格</span>
</h1>


<p>
儿童理发 · 成人剪发 · 造型设计
</p>


<button>
立即预约
</button>


</section>



<div class="photo">

<img src="meifa.jpg" alt="风格美发">

</div>



<div class="box">

<h2>
服务项目
</h2>


<p>
儿童理发：15元</p>

<p>
成人剪发：20元</p>

<p>
洗剪吹、简单造型设计</p>


</div>



<div class="box">

<h2>
店铺地址
</h2>

<p>
锦绣上河园尚园西门北100米处
</p>


<h2>
联系电话
</h2>

<p>
18253626865
</p>


</div>

</html>
